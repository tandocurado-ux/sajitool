# Render Blueprint。計測エンジンを Background Worker として常駐させる。
# HTTP は受けないのでヘルスチェックは不要。ログは Render の Logs に出る。
services:
  - type: worker
    name: sajitool-engine
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      # --- 値は Render の Environment で設定する（ここには置かない）---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # SOAX はパスワードでパッケージを識別する（ユーザー名に package ID は不要）
      - key: SOAX_PASS
        sync: false
      # Slack / Discord の incoming webhook。未設定ならログのみ。
      - key: ALERT_WEBHOOK_URL
        sync: false

      # --- 既定値のままで動くもの ---
      # スケジューラの実行間隔（秒）。1検索ごとにこの範囲の一様ランダムで待つ。
      - key: RUN_INTERVAL_MIN_SECONDS
        value: "60"
      - key: RUN_INTERVAL_MAX_SECONDS
        value: "180"
      # キューに積む上限。超えた分は積まずに捨てる。
      - key: QUEUE_MAX_ITEMS
        value: "60"
      - key: SOAX_ENDPOINT
        value: proxy.soax.com:1337
      - key: SOAX_COUNTRY
        value: jp
      - key: SOAX_NETWORK
        value: res
      - key: SOAX_ROTATE_SECONDS
        value: "300"
      # regions.prefecture から region トークンを付けるか（0 で無効）
      - key: SOAX_REGION_ENABLED
        value: "1"

      # --- Google だけ検知されるときの対処（既定は無効）---
      # Google のときだけ使うプール。res=住宅 / mob=モバイル。
      # モバイルは帯域単価が高いことがあるので、切り替えたら使用量を見ること。
      - key: SOAX_GOOGLE_NETWORK
        value: res
      # 1 で Google のときだけ region を外して country-jp のみにする
      - key: SOAX_GOOGLE_OMIT_REGION
        value: "0"
      # Google のときだけローテート間隔を変える（空なら SOAX_ROTATE_SECONDS）
      - key: SOAX_GOOGLE_ROTATE_SECONDS
        value: ""
